name: Assignment 1 CPU contracts and evidence
on:
  push:
    paths: ['assignment1/a1_m2/**', '.github/workflows/a1-final.yml']
  pull_request:
    paths: ['assignment1/a1_m2/**', '.github/workflows/a1-final.yml']
permissions:
  contents: read
concurrency:
  group: garmentlab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cpu-contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: assignment1/a1_m2
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            assignment1/a1_m2/requirements-garmentlab-draft.txt
            assignment1/a1_m2/requirements-garmentlab-cpu-lock.txt
            assignment1/a1_m2/requirements-public-tests.txt
      - run: python -m pip install -r requirements-public-tests.txt --index-url https://pypi.org/simple
      - run: python -m pip check
      - run: python -m pytest tests -q --basetemp .private-build/ci-tests --junitxml=.private-build/cpu-junit.xml
      - run: python tools/verify_a1_final_evidence.py
      - run: python tools/verify_confirmatory_evidence.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpu-test-results
          path: assignment1/a1_m2/.private-build/cpu-junit.xml
          if-no-files-found: ignore
