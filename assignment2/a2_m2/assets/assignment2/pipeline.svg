<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="220" viewBox="0 0 1080 220">
  <style>
    .box { fill: #f8fafc; stroke: #2563eb; stroke-width: 2; rx: 8; ry: 8; }
    .box-alt { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2; rx: 8; ry: 8; }
    .title { font-family: Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #0f172a; text-anchor: middle; }
    .sub { font-family: Arial, sans-serif; font-size: 11px; fill: #334155; text-anchor: middle; }
    .arrow { stroke: #475569; stroke-width: 2; fill: none; marker-end: url(#m); }
  </style>
  <defs>
    <marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#475569"/>
    </marker>
  </defs>
  <rect class="box" x="15" y="45" width="125" height="125"/>
  <text class="title" x="77" y="75">1. Raw VOC2007</text>
  <text class="sub" x="77" y="96">5,011 RGB + XML</text>
  <text class="sub" x="77" y="114">4,014 train / 997 val</text>
  <text class="sub" x="77" y="132">000863/008364 grouped</text>
  <text class="sub" x="77" y="150">Test set untouched</text>

  <line class="arrow" x1="140" y1="107" x2="165" y2="107"/>
  <rect class="box" x="165" y="45" width="135" height="125"/>
  <text class="title" x="232" y="75">2. Preprocessing</text>
  <text class="sub" x="232" y="96">float32 RGB [0, 1]</text>
  <text class="sub" x="232" y="114">Train: difficult=0 only</text>
  <text class="sub" x="232" y="132">H-Flip p=0.5 (seeded)</text>
  <text class="sub" x="232" y="150">Val: keep difficult flag</text>

  <line class="arrow" x1="300" y1="107" x2="325" y2="107"/>
  <rect class="box" x="325" y="45" width="130" height="125"/>
  <text class="title" x="390" y="75">3. DataLoader</text>
  <text class="sub" x="390" y="96">Custom collate_fn</text>
  <text class="sub" x="390" y="114">SSDLite: B = 8</text>
  <text class="sub" x="390" y="132">Faster R-CNN: B = 2</text>
  <text class="sub" x="390" y="150">Seed 42 Generator</text>

  <line class="arrow" x1="455" y1="107" x2="480" y2="107"/>
  <rect class="box-alt" x="480" y="30" width="175" height="155"/>
  <text class="title" x="567" y="56">4. Detector Models</text>
  <text class="sub" x="567" y="78">Baseline: SSDLite320</text>
  <text class="sub" x="567" y="94">(MobileNetV3, 320x320)</text>
  <text class="sub" x="567" y="116">Pretrained: Faster R-CNN</text>
  <text class="sub" x="567" y="132">(ResNet50-FPN, 640-1000)</text>
  <text class="sub" x="567" y="152">Frozen vs. Full Fine-Tune</text>
  <text class="sub" x="567" y="168">(21 VOC classes + bg)</text>

  <line class="arrow" x1="655" y1="107" x2="680" y2="107"/>
  <rect class="box" x="680" y="45" width="145" height="125"/>
  <text class="title" x="752" y="75">5. Loss &amp; SGD</text>
  <text class="sub" x="752" y="96">Cls + Box Reg losses</text>
  <text class="sub" x="752" y="114">SGD mom=0.9, wd=5e-4</text>
  <text class="sub" x="752" y="132">MultiStepLR + AMP</text>
  <text class="sub" x="752" y="150">Select best Val mAP</text>

  <line class="arrow" x1="825" y1="107" x2="850" y2="107"/>
  <rect class="box-alt" x="850" y="45" width="210" height="125"/>
  <text class="title" x="955" y="75">6. Post-Proc &amp; VOC Eval</text>
  <text class="sub" x="955" y="96">Score &gt;= 0.05, NMS 0.5</text>
  <text class="sub" x="955" y="114">VOC2007 11-pt mAP@0.5</text>
  <text class="sub" x="955" y="132">Per-class &amp; Size AP (S/M/L)</text>
  <text class="sub" x="955" y="150">Error Taxonomy &amp; Latency</text>
</svg>
